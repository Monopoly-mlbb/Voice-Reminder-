
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101116">
  <meta name="description" content="A beautiful voice alarm and reminder app.">
  <title>Voice Reminder</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">YOUR PERSONAL ASSISTANT</p>
        <h1>Voice Reminder</h1>
      </div>
      <div class="sound-icon">♫</div>
    </header>

    <main>
      <section class="clock-card">
        <p>YOUR TIME</p>
        <div id="clock">00:00</div>
        <div id="today">Loading date...</div>
      </section>

      <section class="section-heading">
        <h2>Your reminders</h2>
        <span id="reminderCount">0 reminders</span>
      </section>

      <section id="reminderList" class="reminder-list">
        <div class="empty-state">
          <div class="empty-icon">◷</div>
          <h3>No reminders yet</h3>
          <p>Your reminders will appear here.</p>
        </div>
      </section>

      <button id="addReminder" class="add-button">
        <span>＋</span> Add reminder
      </button>
    </main>

    <footer>
      Made for your everyday moments.
    </footer>
  </div>

  <script src="script.js"></script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js")
      .then(() => console.log("Offline support enabled"))
      .catch(error => console.log("Service worker error:", error));
  });
}
</script>
</body>
</html>
